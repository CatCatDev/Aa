<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4키 하이퍼 리듬게임 - 화면 전체 터치 대응</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            margin: 0;
            background: #09090f;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 520px;
            height: 100%;
            max-height: 900px;
            background: #11111b;
            border-left: 1px solid #22223b;
            border-right: 1px solid #22223b;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.1);
        }
        .header-ui {
            padding: 10px 15px;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 2px solid #22223b;
            z-index: 5;
        }
        #ui-song-name { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ff0055; }
        #ui-score { color: #00ffcc; }
        #ui-combo { color: #ffaa00; }
        
        #tracks-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            background: #0d0d15;
        }
        .track-section {
            flex: 1;
            position: relative;
            display: flex;
            height: 100%;
            border-right: 2px solid #22223b;
        }
        .track-section.ai-side {
            background: rgba(255, 0, 85, 0.03);
            pointer-events: none; /* AI 영역 터치 방지 */
        }
        .ai-label {
            position: absolute;
            top: 5px;
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: #ff0055;
            font-weight: bold;
            z-index: 4;
        }
        .lane {
            flex: 1;
            border-right: 1px solid rgba(255,255,255,0.06);
            position: relative;
            height: 100%;
            cursor: pointer;
        }
        .lane:last-child { border-right: none; }
        
        .note {
            position: absolute;
            width: 100%;
            height: 24px;
            background: linear-gradient(180deg, #00ffff, #0066ff);
            border-radius: 6px;
            box-shadow: 0 0 12px #00ffff;
            pointer-events: none;
        }
        .ai-note {
            background: linear-gradient(180deg, #ff0055, #ff6600) !important;
            box-shadow: 0 0 12px #ff0055 !important;
        }
        
        .judgement-line {
            position: absolute;
            bottom: 120px;
            width: 100%;
            height: 4px;
            background: #ff0055;
            box-shadow: 0 0 12px #ff0055;
            z-index: 3;
            pointer-events: none;
        }

        #feedback {
            position: absolute;
            bottom: 180px;
            width: 100%;
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            z-index: 4;
            pointer-events: none;
            transition: transform 0.05s;
        }

        /* 하단 터치패드 영역 */
        .touch-pad {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            display: flex;
            z-index: 5;
            background: rgba(0,0,0,0.6);
            border-top: 2px solid #22223b;
        }
        .touch-key {
            flex: 1;
            border-right: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #8888aa;
            background: rgba(255,255,255,0.02);
            transition: background 0.05s;
        }
        .touch-key:last-child { border-right: none; }
        .touch-key.active {
            background: rgba(0, 255, 255, 0.3);
            color: #00ffcc;
            box-shadow: inset 0 0 25px rgba(0, 255, 255, 0.5);
        }

        /* 메뉴 화면 */
        #menu, #result-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 9, 15, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }
        h2 { margin: 0 0 10px 0; color: #00ffcc; font-size: 22px; }
        
        .panel-box {
            background: #161625;
            border: 1px solid #2a2a4e;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            width: 100%;
            max-width: 380px;
        }
        .panel-title { font-size: 12px; color: #aaa; margin-bottom: 6px; font-weight: bold; }
        
        .speed-btns, .mode-btns {
            display: flex;
            gap: 5px;
            justify-content: center;
        }
        .opt-btn {
            flex: 1;
            padding: 6px;
            background: #22223b;
            border: 1px solid #3f3f5f;
            color: #aaa;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .opt-btn.selected {
            background: #ff0055;
            border-color: #ff0055;
            color: white;
            box-shadow: 0 0 8px rgba(255,0,85,0.5);
        }

        .song-btn {
            width: 100%;
            padding: 10px 14px;
            margin: 4px 0;
            font-size: 13px;
            font-weight: bold;
            background: #1a1a2e;
            color: white;
            border: 1px solid #2a2a4e;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .song-btn:active { background: #ff0055; }
        
        #result-screen { display: none; }
        .primary-btn {
            padding: 12px 30px;
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff0055;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- 메뉴 화면 -->
        <div id="menu">
            <h2>HYPER RHYTHM</h2>
            
            <div class="panel-box">
                <div class="panel-title">⚡ 노트 속도 조절 (Speed)</div>
                <div class="speed-btns">
                    <button class="opt-btn" onclick="setSpeed(0.7)">0.7x</button>
                    <button class="opt-btn selected" onclick="setSpeed(1.0)">1.0x (기본)</button>
                    <button class="opt-btn" onclick="setSpeed(1.3)">1.3x</button>
                    <button class="opt-btn" onclick="setSpeed(1.6)">1.6x</button>
                    <button class="opt-btn" onclick="setSpeed(2.0)">2.0x</button>
                </div>
            </div>

            <div class="panel-box">
                <div class="panel-title">🤖 플레이 모드 & AI 봇 난이도</div>
                <div class="mode-btns" style="margin-bottom: 6px;">
                    <button class="opt-btn selected" id="mode-solo" onclick="setMode('solo')">👤 솔로 플레이</button>
                    <button class="opt-btn" id="mode-ai" onclick="setMode('ai')">🤖 AI 봇 대전</button>
                </div>
                <div class="speed-btns" id="ai-levels" style="display: none;">
                    <button class="opt-btn ai-lvl selected" onclick="setAiLevel(1)">Lv.1</button>
                    <button class="opt-btn ai-lvl" onclick="setAiLevel(2)">Lv.2</button>
                    <button class="opt-btn ai-lvl" onclick="setAiLevel(3)">Lv.3</button>
                    <button class="opt-btn ai-lvl" onclick="setAiLevel(4)">Lv.4</button>
                    <button class="opt-btn ai-lvl" onclick="setAiLevel(5)">Lv.5(신)</button>
                </div>
            </div>

            <div id="song-list" style="width: 100%; max-width: 380px; max-height: 32vh; overflow-y: auto;"></div>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen">
            <h2 id="res-title">GAME OVER</h2>
            <p id="res-song-title" style="color: #ffaa00; font-weight: bold; font-size: 15px;"></p>
            <p id="res-score" style="font-size: 18px; color: #00ffcc; margin: 6px 0;"></p>
            <p id="res-ai-score" style="font-size: 15px; color: #ff0055; margin: 4px 0; display: none;"></p>
            <p id="res-max-combo" style="font-size: 14px; color: #aaa;"></p>
            <button class="primary-btn" onclick="returnToMenu()">메뉴로 돌아가기</button>
        </div>

        <!-- 상단 헤더 -->
        <div class="header-ui">
            <div id="ui-song-name">곡 제목</div>
            <div><span id="ui-score">0</span> | <span id="ui-combo">0 COMBO</span></div>
        </div>

        <!-- 게임 레인 -->
        <div id="tracks-wrapper">
            <div class="track-section" id="player-track">
                <div class="lane" data-lane="0"></div>
                <div class="lane" data-lane="1"></div>
                <div class="lane" data-lane="2"></div>
                <div class="lane" data-lane="3"></div>
                <div class="judgement-line"></div>
            </div>
            <div class="track-section ai-side" id="ai-track" style="display: none;">
                <div class="ai-label" id="ai-name">AI BOT (Lv.3)</div>
                <div class="lane" data-ailane="0"></div>
                <div class="lane" data-ailane="1"></div>
                <div class="lane" data-ailane="2"></div>
                <div class="lane" data-ailane="3"></div>
                <div class="judgement-line"></div>
            </div>
            <div id="feedback">READY</div>
        </div>

        <!-- 하단 터치패드 -->
        <div class="touch-pad">
            <div class="touch-key" data-lane="0">
                <span style="font-size: 18px; color: #00ffff;">A</span>
                <span style="font-size: 10px; color: #666; margin-top: 2px;">LANE 1</span>
            </div>
            <div class="touch-key" data-lane="1">
                <span style="font-size: 18px; color: #00ffff;">S</span>
                <span style="font-size: 10px; color: #666; margin-top: 2px;">LANE 2</span>
            </div>
            <div class="touch-key" data-lane="2">
                <span style="font-size: 18px; color: #00ffff;">D</span>
                <span style="font-size: 10px; color: #666; margin-top: 2px;">LANE 3</span>
            </div>
            <div class="touch-key" data-lane="3">
                <span style="font-size: 18px; color: #00ffff;">F</span>
                <span style="font-size: 10px; color: #666; margin-top: 2px;">LANE 4</span>
            </div>
        </div>
    </div>

<script>
    const keys = ['KeyA', 'KeyS', 'KeyD', 'KeyF'];
    
    const songs = [
        { id: 1, title: "Lv.1 Cyber Awakening", bpm: 90, speed: 3.0, density: 55 },
        { id: 2, title: "Lv.2 Neon Pulse", bpm: 100, speed: 3.5, density: 48 },
        { id: 3, title: "Lv.3 Digital Drift", bpm: 110, speed: 4.0, density: 42 },
        { id: 4, title: "Lv.4 Synth Wave Runner", bpm: 120, speed: 4.5, density: 36 },
        { id: 5, title: "Lv.5 Hyper Overdrive", bpm: 135, speed: 5.0, density: 30 },
        { id: 6, title: "Lv.6 Glitch Matrix", bpm: 150, speed: 5.5, density: 25 },
        { id: 7, title: "Lv.7 Turbo Core", bpm: 165, speed: 6.0, density: 20 },
        { id: 8, title: "Lv.8 Cyber Hell", bpm: 180, speed: 6.5, density: 16 },
        { id: 9, title: "Lv.9 Overclocked Circuit", bpm: 200, speed: 7.0, density: 13 },
        { id: 10, title: "Lv.10 [THE UNKNOWN]", bpm: 220, speed: 7.8, density: 10 }
    ];

    let currentSong = null;
    let score = 0;
    let aiScore = 0;
    let combo = 0;
    let maxCombo = 0;
    let gameActive = false;
    let notes = [];
    let aiNotes = [];
    let frameCount = 0;
    let audioCtx = null;

    let speedMultiplier = 1.0;
    let gameMode = 'solo';
    let aiLevel = 3;

    const playerLanes = document.querySelectorAll('#player-track .lane');
    const aiLanes = document.querySelectorAll('#ai-track .lane');
    const touchKeys = document.querySelectorAll('.touch-key');
    const scoreDisplay = document.getElementById('ui-score');
    const comboDisplay = document.getElementById('ui-combo');
    const feedback = document.getElementById('feedback');
    const menu = document.getElementById('menu');
    const resultScreen = document.getElementById('result-screen');

    function setSpeed(val) {
        speedMultiplier = val;
        document.querySelectorAll('.speed-btns .opt-btn').forEach(btn => btn.classList.remove('selected'));
        event.target.classList.add('selected');
    }

    function setMode(mode) {
        gameMode = mode;
        document.getElementById('mode-solo').classList.toggle('selected', mode === 'solo');
        document.getElementById('mode-ai').classList.toggle('selected', mode === 'ai');
        document.getElementById('ai-levels').style.display = mode === 'ai' ? 'flex' : 'none';
    }

    function setAiLevel(lvl) {
        aiLevel = lvl;
        document.querySelectorAll('.ai-lvl').forEach(btn => btn.classList.remove('selected'));
        event.target.classList.add('selected');
    }

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(freq, type = 'sine', duration = 0.08) {
        if (!audioCtx) return;
        try {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function buildSongMenu() {
        let container = document.getElementById('song-list');
        container.innerHTML = '';
        songs.forEach(song => {
            let btn = document.createElement('button');
            btn.className = 'song-btn';
            btn.innerHTML = `<span>${song.title}</span> <span style="color:#ff0055">BPM ${song.bpm}</span>`;
            btn.onclick = () => startSong(song);
            container.appendChild(btn);
        });
    }
    buildSongMenu();

    function startSong(song) {
        initAudio();
        currentSong = song;
        score = 0;
        aiScore = 0;
        combo = 0;
        maxCombo = 0;
        notes = [];
        aiNotes = [];
        frameCount = 0;
        gameActive = true;

        menu.style.display = 'none';
        resultScreen.style.display = 'none';
        document.getElementById('ui-song-name').innerText = song.title;
        scoreDisplay.innerText = "0";
        comboDisplay.innerText = "0 COMBO";
        feedback.innerText = "START!";

        if (gameMode === 'ai') {
            document.getElementById('ai-track').style.display = 'flex';
            document.getElementById('ai-name').innerText = `AI BOT (Lv.${aiLevel})`;
        } else {
            document.getElementById('ai-track').style.display = 'none';
        }

        requestAnimationFrame(gameLoop);
    }

    function spawnNote() {
        if (!gameActive) return;
        let laneIdx = Math.floor(Math.random() * 4);

        let noteEl = document.createElement('div');
        noteEl.classList.add('note');
        noteEl.style.top = '-30px';
        playerLanes[laneIdx].appendChild(noteEl);
        notes.push({ element: noteEl, lane: laneIdx, y: -30, hit: false });

        if (gameMode === 'ai') {
            let aiNoteEl = document.createElement('div');
            aiNoteEl.classList.add('note', 'ai-note');
            aiNoteEl.style.top = '-30px';
            aiLanes[laneIdx].appendChild(aiNoteEl);
            aiNotes.push({ element: aiNoteEl, lane: laneIdx, y: -30, hit: false });
        }

        if (frameCount % 12 === 0) {
            let melody = [220, 246.94, 329.63, 440, 554.37];
            playSound(melody[Math.floor(Math.random() * melody.length)], 'triangle', 0.08);
        }
    }

    function triggerEffect(laneIdx) {
        let keyEl = touchKeys[laneIdx];
        keyEl.classList.add('active');
        setTimeout(() => keyEl.classList.remove('active'), 70);
    }

    function handleInput(laneIdx) {
        if (!gameActive) return;
        triggerEffect(laneIdx);
        playSound(520 + laneIdx * 110, 'square', 0.05);

        const targetY = playerLanes[0].clientHeight - 120; 
        let hitProcessed = false;

        for (let note of notes) {
            if (note.lane === laneIdx && !note.hit) {
                let diff = Math.abs(note.y - targetY);
                if (diff < 65) {
                    note.hit = true;
                    note.element.remove();
                    hitProcessed = true;

                    if (diff < 22) {
                        showFeedback("PERFECT!", "#00ffcc");
                        score += 300 * currentSong.id;
                    } else if (diff < 42) {
                        showFeedback("GREAT!", "#00ccff");
                        score += 200 * currentSong.id;
                    } else {
                        showFeedback("GOOD", "#ffff00");
                        score += 100 * currentSong.id;
                    }
                    combo++;
                    if (combo > maxCombo) maxCombo = combo;
                    break;
                }
            }
        }

        scoreDisplay.innerText = score;
        comboDisplay.innerText = combo > 1 ? `${combo} COMBO` : "";
    }

    function showFeedback(text, color) {
        feedback.innerText = text;
        feedback.style.color = color;
        feedback.style.transform = "scale(1.2)";
        setTimeout(() => feedback.style.transform = "scale(1)", 40);
    }

    // 컴퓨터 키보드 입력
    const activeKeys = {};
    window.addEventListener('keydown', (e) => {
        let idx = keys.indexOf(e.code);
        if (idx !== -1) {
            e.preventDefault();
            if (!activeKeys[e.code]) {
                activeKeys[e.code] = true;
                handleInput(idx);
            }
        }
    });

    window.addEventListener('keyup', (e) => {
        let idx = keys.indexOf(e.code);
        if (idx !== -1) {
            activeKeys[e.code] = false;
        }
    });

    // 모바일 터치 입력 (레인 영역 '위쪽 전체' & 하단 터치패드 영역 모두 처리)
    playerLanes.forEach((lane) => {
        let idx = parseInt(lane.getAttribute('data-lane'));
        lane.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput(idx);
        }, { passive: false });
    });

    touchKeys.forEach((tkey) => {
        let idx = parseInt(tkey.getAttribute('data-lane'));
        tkey.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput(idx);
        }, { passive: false });
    });

    function gameLoop() {
        if (!gameActive) return;

        frameCount++;
        let density = Math.max(10, Math.floor(currentSong.density / speedMultiplier));
        if (frameCount % density === 0) {
            spawnNote();
        }

        let containerHeight = playerLanes[0].clientHeight;
        let currentSpeed = currentSong.speed * speedMultiplier;

        for (let i = notes.length - 1; i >= 0; i--) {
            let note = notes[i];
            if (!note.hit) {
                note.y += currentSpeed;
                note.element.style.top = `${note.y}px`;

                if (note.y > containerHeight - 90) {
                    note.hit = true;
                    note.element.remove();
                    notes.splice(i, 1);
                    combo = 0;
                    comboDisplay.innerText = "";
                    showFeedback("MISS", "#ff0055");
                    playSound(120, 'sawtooth', 0.08);
                }
            } else {
                notes.splice(i, 1);
            }
        }

        if (gameMode === 'ai') {
            let targetY = containerHeight - 120;
            let hitAccuracy = [0, 0.5, 0.7, 0.85, 0.95, 1.0][aiLevel];
            
            for (let i = aiNotes.length - 1; i >= 0; i--) {
                let note = aiNotes[i];
                if (!note.hit) {
                    note.y += currentSpeed;
                    note.element.style.top = `${note.y}px`;

                    if (!note.aiProcessed && note.y >= targetY - (15 * (6 - aiLevel))) {
                        note.aiProcessed = true;
                        if (Math.random() < hitAccuracy) {
                            note.hit = true;
                            note.element.remove();
                            aiNotes.splice(i, 1);
                            aiScore += 300 * currentSong.id;
                        }
                    }

                    if (note.y > containerHeight - 90) {
                        note.hit = true;
                        note.element.remove();
                        aiNotes.splice(i, 1);
                    }
                } else {
                    aiNotes.splice(i, 1);
                }
            }
        }

        if (frameCount > 2200) {
            endGame();
            return;
        }

        requestAnimationFrame(gameLoop);
    }

    function endGame() {
        gameActive = false;
        document.querySelectorAll('.note').forEach(n => n.remove());
        
        document.getElementById('res-song-title').innerText = currentSong.title;
        document.getElementById('res-score').innerText = `내 최종 점수: ${score}`;
        
        if (gameMode === 'ai') {
            let aiResultText = document.getElementById('res-ai-score');
            aiResultText.style.display = 'block';
            aiResultText.innerText = `AI 봇 점수: ${aiScore}`;
            
            let resTitle = document.getElementById('res-title');
            if (score > aiScore) {
                resTitle.innerText = "VICTORY! (승리)";
                resTitle.style.color = "#00ffcc";
            } else if (score < aiScore) {
                resTitle.innerText = "DEFEAT... (패배)";
                resTitle.style.color = "#ff0055";
            } else {
                resTitle.innerText = "DRAW! (무승부)";
                resTitle.style.color = "#ffaa00";
            }
        } else {
            document.getElementById('res-ai-score').style.display = 'none';
            let resTitle = document.getElementById('res-title');
            resTitle.innerText = "STAGE CLEAR!";
            resTitle.style.color = "#00ffcc";
        }

        document.getElementById('res-max-combo').innerText = `최대 콤보: ${maxCombo}`;
        resultScreen.style.display = 'flex';
    }

    function returnToMenu() {
        resultScreen.style.display = 'none';
        menu.style.display = 'flex';
    }
</script>

</body>
</html>
